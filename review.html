<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Details - GlowMatch</title>
  <style>
    :root {
      --bg-body: #fdf8f9;
      --bg-card: #ffffff;
      --bg-input: #f7eef0;
      --text-main: #2b191c;
      --text-muted: #5c4347;
      --accent-color: #8c0d25;
      --accent-hover: #a8122f;
      --border-color: #ebdadd;
      --shadow: 0 4px 15px rgba(43, 25, 28, 0.06);
    }

    body.dark-mode {
      --bg-body: #1c1012;
      --bg-card: #2b191c;
      --bg-input: #1c1012;
      --text-main: #f5e6e8;
      --text-muted: #d8c3c6;
      --accent-color: #8c0d25;
      --accent-hover: #a8122f;
      --border-color: #44282d;
      --shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-body);
      color: var(--text-main);
      padding: 20px;
      transition: background-color 0.3s, color 0.3s;
    }

    .top-bar {
      max-width: 1000px;
      margin: 0 auto 20px auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .back-link {
      color: var(--accent-color);
      text-decoration: none;
      font-weight: bold;
    }

    body.dark-mode .back-link {
      color: #e2959e;
    }

    .theme-btn {
      background-color: var(--bg-card);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      padding: 8px 16px;
      border-radius: 20px;
      cursor: pointer;
      font-weight: bold;
      transition: 0.3s;
    }

    .product-container {
      max-width: 1000px;
      margin: 0 auto 40px auto;
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      box-shadow: var(--shadow);
      border-radius: 16px;
      padding: 30px;
      display: flex;
      gap: 35px;
      align-items: center;
      flex-wrap: wrap;
      transition: background-color 0.3s;
    }

    .product-image {
      flex: 1;
      min-width: 280px;
    }

    .product-image img {
      width: 100%;
      max-height: 400px;
      border-radius: 12px;
      object-fit: cover;
    }

    .product-info {
      flex: 1.3;
      min-width: 280px;
    }

    .category-badge {
      display: inline-block;
      background-color: var(--bg-input);
      color: var(--accent-color);
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 0.85rem;
      font-weight: bold;
      text-transform: uppercase;
      margin-bottom: 10px;
      border: 1px solid var(--border-color);
    }

    body.dark-mode .category-badge {
      color: #e2959e;
    }

    .product-info h1 {
      font-size: 2rem;
      margin-bottom: 10px;
    }

    .product-price {
      font-size: 1.4rem;
      font-weight: bold;
      color: var(--accent-color);
      margin-bottom: 20px;
    }

    body.dark-mode .product-price {
      color: #e2959e;
    }

    .product-desc {
      line-height: 1.7;
      color: var(--text-muted);
      margin-bottom: 25px;
      font-size: 1.05rem;
    }

    .add-to-cart-btn {
      background-color: var(--accent-color);
      color: white;
      border: none;
      padding: 14px 40px;
      border-radius: 25px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
    }

    .add-to-cart-btn:hover:not(:disabled) {
      background-color: var(--accent-hover);
    }

    .add-to-cart-btn:disabled {
      background-color: #666;
      cursor: not-allowed;
      opacity: 0.7;
    }

    .reviews-container {
      max-width: 1000px;
      margin: 0 auto;
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      box-shadow: var(--shadow);
      border-radius: 16px;
      padding: 30px;
      transition: background-color 0.3s;
    }

    .reviews-container h2 {
      margin-bottom: 20px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 10px;
    }

    .review-card {
      background-color: var(--bg-input);
      padding: 15px 20px;
      border-radius: 12px;
      margin-bottom: 15px;
      border: 1px solid var(--border-color);
    }

    .review-header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
      color: var(--accent-color);
    }

    body.dark-mode .review-header {
      color: #e2959e;
    }

    .add-review-form {
      margin-top: 30px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .add-review-form input,
    .add-review-form select,
    .add-review-form textarea {
      background-color: var(--bg-input);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 12px;
      border-radius: 10px;
      font-size: 0.95rem;
    }
  </style>
</head>
<body>

  <div class="top-bar">
    <a href="products.html" class="back-link">← Back to Products</a>
    <button class="theme-btn" id="theme-toggle">☀️ Light</button>
  </div>

  <div class="product-container" id="product-details"></div>

  <div class="reviews-container">
    <h2>Customer Reviews</h2>
    <div id="reviews-list"></div>

    <form class="add-review-form" id="review-form">
      <h3>Write a Review</h3>
      <input type="text" id="reviewer-name" placeholder="Your Name" required>
      <select id="reviewer-rating">
        <option value="⭐⭐⭐⭐⭐">⭐⭐⭐⭐⭐ (5/5)</option>
        <option value="⭐⭐⭐⭐">⭐⭐⭐⭐ (4/5)</option>
        <option value="⭐⭐⭐">⭐⭐⭐ (3/5)</option>
      </select>
      <textarea id="reviewer-comment" rows="3" placeholder="Share your experience with this product..." required></textarea>
      <button type="submit" class="add-to-cart-btn" style="width: fit-content;">Submit Review</button>
    </form>
  </div>

  <script src="./js/products.js"></script>
  <script src="review.js"></script>

</body>
</html>
